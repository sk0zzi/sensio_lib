[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensio-lib"
version = "1.0.0"
description = "A library to control Sensio smart house systems"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "aioresponses>=0.7,<1",
]
